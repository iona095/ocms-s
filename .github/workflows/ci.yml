name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax check
        shell: pwsh
        run: |
          node --check sync.mjs
          node --check ui.mjs
          node --check dsh/host.mjs
          node --check dsh/lifecycle.mjs
          node --check dsh/build-client.mjs
          node --check tests/sync.test.mjs
          node --check tests/v1.4/disposal-race.test.mjs

      - name: Prove clean-machine condition
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:USERPROFILE '.dsh')) { throw 'runner has a real ~/.dsh; tests must be hermetic' }
          if (Get-Command dsh -ErrorAction SilentlyContinue) { throw 'runner has dsh on PATH; tests must be hermetic' }

      - name: Run tests
        run: npm test
        env:
          npm_config_script_shell: bash

  profile-suites:
    # S5 profile suites against a real DSH (contract v1.4.6-rc4 P2).
    #
    # Two matrix entries (v1.4.7-rc6 §2, §3):
    #   tree: verified  the full verified alpha.1 tree, selected by
    #                     --before=2026-10-14T11:40:00Z, so the eleven
    #                     resolved versions below cannot drift;
    #   tree: alpha2    the unpinned fresh install every new user gets today
    #                     (the coordinated 2026-10-14 alpha.2 release),
    #                     asserted as a whole tree.
    # DSH is installed into a job-local prefix — never package.json or
    # package-lock.json (the frozen dependency-surface tests require
    # devDependencies to stay empty) — and that prefix bin is put on PATH for
    # this job only. The hermetic test job above keeps its clean-machine guard
    # unchanged and never sees a PATH dsh.
    name: profile suites (real DSH, tree ${{ matrix.tree }})
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        tree: [verified, alpha2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # --- pinned install: this entry only -----------------------------------
      - name: Install verified DSH tree (--before 11:40Z selects the alpha.1 publications)
        if: matrix.tree == 'verified'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'dsh-real'
          npm install -g --prefix $prefix --before=2026-10-14T11:40:00Z @deepseek-ai/dsh@0.2.1-alpha.2
          # On Windows the npm global shims (dsh.cmd) live directly in the
          # prefix; keep the POSIX bin layout too so the step stays correct.
          Add-Content -Path $env:GITHUB_PATH -Value $prefix
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $prefix 'bin')

      # --- unpinned install: this entry only ---------------------------------
      - name: Install alpha2 DSH tree (unpinned, what new users resolve today)
        if: matrix.tree == 'alpha2'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'dsh-real'
          npm install -g --prefix $prefix @deepseek-ai/dsh@0.2.1-alpha.2
          Add-Content -Path $env:GITHUB_PATH -Value $prefix
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $prefix 'bin')

      - name: Verify pinned DSH
        shell: pwsh
        run: |
          dsh --version
          $v = (dsh --version | Out-String).Trim()
          if ($v -ne '0.2.1-alpha.2') { throw "pinned DSH mismatch: got '$v', want '0.2.1-alpha.2'" }

      # --- print and assert the resolved tree: verified entry only -----------
      - name: Assert resolved versions (verified alpha.1 tree)
        if: matrix.tree == 'verified'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'dsh-real'
          $top = Join-Path $prefix 'node_modules/@deepseek-ai'
          $nested = Join-Path $prefix 'node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai'
          $own = Join-Path $prefix 'node_modules/@deepseek-ai/dsh/node_modules'
          function Assert-Version($pkg, $want) {
            $manifest = Join-Path $nested "$pkg/package.json"
            if (-not (Test-Path $manifest)) { $manifest = Join-Path $top "$pkg/package.json" }
            if (-not (Test-Path $manifest)) { $manifest = Join-Path $own "$pkg/package.json" }
            if (-not (Test-Path $manifest)) { throw "resolved $pkg is missing from $top, $nested and $own" }
            $got = (Get-Content $manifest -Raw | ConvertFrom-Json).version
            Write-Host "$pkg resolved $got expected $want"
            if ($got -ne $want) { throw "resolved $pkg drift: got '$got', want '$want'" }
          }
          Assert-Version 'dsh' '0.2.1-alpha.2'
          Assert-Version 'dsh-app-boot' '0.2.1-alpha.2'
          Assert-Version 'dsh-atomic-write' '0.2.1-alpha.2'
          Assert-Version 'cordis' '4.0.5-alpha.1'
          Assert-Version 'cordis-plugin-group' '1.0.5-alpha.1'
          Assert-Version 'cordis-plugin-include' '1.0.10-alpha.1'
          Assert-Version 'cordis-plugin-loader' '1.0.6-alpha.1'
          Assert-Version 'cordis-plugin-timer' '1.1.7-alpha.1'
          Assert-Version 'cosmokit' '1.8.6-alpha.1'
          Assert-Version 'schemastery' '3.18.5-alpha.1'
          Assert-Version 'node-addon-require-builtin' '0.1.9'

      # --- print and assert the resolved tree: alpha2 entry only -------------
      - name: Assert resolved versions (alpha2 tree)
        if: matrix.tree == 'alpha2'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'dsh-real'
          $top = Join-Path $prefix 'node_modules/@deepseek-ai'
          $nested = Join-Path $prefix 'node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai'
          $own = Join-Path $prefix 'node_modules/@deepseek-ai/dsh/node_modules'
          function Assert-Version($pkg, $want) {
            $manifest = Join-Path $nested "$pkg/package.json"
            if (-not (Test-Path $manifest)) { $manifest = Join-Path $top "$pkg/package.json" }
            if (-not (Test-Path $manifest)) { $manifest = Join-Path $own "$pkg/package.json" }
            if (-not (Test-Path $manifest)) { throw "resolved $pkg is missing from $top, $nested and $own" }
            $got = (Get-Content $manifest -Raw | ConvertFrom-Json).version
            Write-Host "$pkg resolved $got expected $want"
            if ($got -ne $want) { throw "resolved $pkg drift: got '$got', want '$want'" }
          }
          Assert-Version 'dsh' '0.2.1-alpha.2'
          Assert-Version 'dsh-app-boot' '0.2.1-alpha.2'
          Assert-Version 'dsh-atomic-write' '0.2.1-alpha.2'
          Assert-Version 'cordis' '4.0.5-alpha.2'
          Assert-Version 'cordis-plugin-group' '1.0.5-alpha.2'
          Assert-Version 'cordis-plugin-include' '1.0.10-alpha.2'
          Assert-Version 'cordis-plugin-loader' '1.0.6-alpha.2'
          Assert-Version 'cordis-plugin-timer' '1.1.7-alpha.2'
          Assert-Version 'cosmokit' '1.8.6-alpha.2'
          Assert-Version 'schemastery' '3.18.5-alpha.2'
          Assert-Version 'node-addon-require-builtin' '0.1.9'

      - name: Run profile suites
        run: npm run test:profile
        env:
          npm_config_script_shell: bash

  acceptance-smoke:
    # Real-runtime acceptance: the committed plugin through a real Cordis
    # runtime, a real ui.mjs child, and OS-level child-liveness observation,
    # exercising the retirement-before-replacement ordering required by
    # DSH 0.2.1-alpha.2 (registry.delete -> await old fiber settlement ->
    # replacement loaded/activated; OCMS owns no generation coordinator).
    # This job does not invoke @deepseek-ai/dsh-hmr itself (that package is not
    # installed here), so it makes no claim about its internals; the OCMS-layer
    # sequencing contract is also covered by tests/v1.4/hmr-generation.test.mjs.
    # Windows / Node 22 only, because it
    # spawns real processes and reads the Windows process table. The ordinary
    # test matrix above is unchanged and stays the regression gate.
    name: acceptance smoke (real child, retirement ordering)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run acceptance smoke (strict)
        # --strict: a missing prerequisite fails this step instead of reporting
        # a green acceptance, so a skipped section can never pass CI.
        run: npm run test:smoke -- --strict
        env:
          npm_config_script_shell: bash
