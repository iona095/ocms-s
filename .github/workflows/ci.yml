name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax check
        shell: pwsh
        run: |
          node --check sync.mjs
          node --check ui.mjs
          node --check dsh/host.mjs
          node --check dsh/lifecycle.mjs
          node --check dsh/build-client.mjs
          node --check tests/sync.test.mjs
          node --check tests/v1.4/disposal-race.test.mjs

      - name: Run tests
        run: npm test
        env:
          npm_config_script_shell: bash
