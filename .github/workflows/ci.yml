name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax check
        shell: pwsh
        run: |
          node --check sync.mjs
          node --check ui.mjs
          node --check dsh/host.mjs
          node --check dsh/lifecycle.mjs
          node --check dsh/build-client.mjs
          node --check tests/sync.test.mjs
          node --check tests/v1.4/disposal-race.test.mjs

      - name: Prove clean-machine condition
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:USERPROFILE '.dsh')) { throw 'runner has a real ~/.dsh; tests must be hermetic' }
          if (Get-Command dsh -ErrorAction SilentlyContinue) { throw 'runner has dsh on PATH; tests must be hermetic' }

      - name: Run tests
        run: npm test
        env:
          npm_config_script_shell: bash

  acceptance-smoke:
    # Real-runtime acceptance: the committed plugin through a real Cordis
    # runtime, a real ui.mjs child, and OS-level child-liveness observation,
    # exercising the retirement-before-replacement ordering required by
    # DSH 0.2.1-alpha.2 (registry.delete -> await old fiber settlement ->
    # replacement loaded/activated; OCMS owns no generation coordinator).
    # This job does not invoke @deepseek-ai/dsh-hmr itself (that package is not
    # installed here), so it makes no claim about its internals; the OCMS-layer
    # sequencing contract is also covered by tests/v1.4/hmr-generation.test.mjs.
    # Windows / Node 22 only, because it
    # spawns real processes and reads the Windows process table. The ordinary
    # test matrix above is unchanged and stays the regression gate.
    name: acceptance smoke (real child, retirement ordering)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run acceptance smoke (strict)
        # --strict: a missing prerequisite fails this step instead of reporting
        # a green acceptance, so a skipped section can never pass CI.
        run: npm run test:smoke -- --strict
        env:
          npm_config_script_shell: bash
